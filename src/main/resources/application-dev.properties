# Conexão ao PostgreSQL usando Variáveis de Ambiente
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Acoesprojct}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate (JPA) para o Postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Configuração para o Flyway aceitar o banco atual
spring.flyway.baseline-on-migrate=true