# ==========================================
# PERFIL PROD - CONFIGURACAO EXTERNA OBRIGATORIA
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Migrations sem contexto continuam normais; o seed @demo fica excluido.
spring.liquibase.contexts=prod

app.market-data.brapi.token=${BRAPI_TOKEN}
app.market-data.twelve-data.apikey=${TWELVE_DATA_API_KEY}

# Sem configuracao externa, nenhuma origem cross-origin e permitida.
app.http.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
