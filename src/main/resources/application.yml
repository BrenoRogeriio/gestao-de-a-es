spring:
  application:
    name: gestao-acoes

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${EXTERNAL_API_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${EXTERNAL_API_READ_TIMEOUT_MS:5000}

  # ==========================================
  # CONFIGURAÇÕES DO LIQUIBASE (AULA 11)
  # ==========================================
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml

  # ==========================================
  # CONFIGURAÇÕES DO HIBERNATE / JPA
  # ==========================================
  jpa:
    hibernate:
      # O Hibernate NÃO cria tabelas mais. Ele apenas valida as do Liquibase.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  http:
    cors:
      # Sem profile/origem explicita, requisicoes cross-origin sao negadas.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  application:
    name: ${spring.application.name}
    description: API de gestão de ações e carteiras multiusuário
