spring.datasource.url=jdbc:h2:mem:gestao-acoes-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# O profile de teste aplica estrutura/correcoes, mas nunca os dados demo.
spring.liquibase.contexts=test

# Clientes Feign podem ser criados, mas testes nao recebem credenciais nem invocam APIs reais.
app.market-data.brapi.token=
app.market-data.twelve-data.apikey=

app.http.cors.allowed-origins=http://localhost:5173
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
